<script>document.getElementById('copy').addEventListener('click',function(){var b=this,t='replaymasters@ulusofona.pt';

if(navigator.clipboard){navigator.clipboard.writeText(t).then(ok,function(){var r=document.createRange();r.selectNodeContents(document.getElementById('mail'));var s=getSelection();s.removeAllRanges();s.addRange(r);});}});</script>
